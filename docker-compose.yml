version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: easygenerator-mongodb
    restart: always
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: easygenerator-api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/easygenerator}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy

  # React / Vite Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: easygenerator-client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  mongodb_data:
